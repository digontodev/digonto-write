# Checks that every commit in a pull request is signed off (Developer Certificate of Origin). See CONTRIBUTING.md.
name: DCO

on:
  pull_request:

permissions:
  contents: read

jobs:
  dco:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Every commit has Signed-off-by
        shell: bash
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          missing=0
          for c in $(git rev-list --no-merges "$BASE..$HEAD"); do
            if ! git log -1 --format=%B "$c" | grep -qiE '^Signed-off-by: .+ <.+@.+>'; then
              echo "::error::Commit $(git log -1 --format='%h %s' "$c") has no Signed-off-by line"
              missing=1
            fi
          done
          if [ $missing = 1 ]; then
            echo "Please sign off your commits: git rebase --signoff $BASE  (see CONTRIBUTING.md)"
            exit 1
          fi
          echo "All commits are signed off."
